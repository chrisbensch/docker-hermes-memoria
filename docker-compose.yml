name: hermes-compose-mcp

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db}
    restart: unless-stopped
    depends_on:
      headroom-mcp:
        condition: service_started
      firecrawl-api:
        condition: service_started
      honcho-api:
        condition: service_healthy
    volumes:
      - ${APPDATA_DIR:-./appdata}/hermes:/opt/data
      # Hermes discovers the top-level AGENTS.md from its working directory.
      # Keep the persistent source in appdata rather than the image layer.
      - type: bind
        source: ${APPDATA_DIR:-./appdata}/hermes/AGENTS.md
        target: /opt/hermes/AGENTS.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCKER_SOCK:-/run/user/1000/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    networks:
      - default
      - honcho-app
    ports:
      # Only useful when you enable Hermes' API server with API_SERVER_KEY or
      # API_SERVER_ENABLED. The API server defaults to container port 8642.
      - "${HERMES_API_BIND_HOST:-127.0.0.1}:${HERMES_API_HOST_PORT:-8642}:8642"
      - "${HERMES_DASHBOARD_BIND_HOST:-127.0.0.1}:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_HOME_MODE: ${HERMES_HOME_MODE:-0755}
      API_SERVER_HOST: ${API_SERVER_HOST:-0.0.0.0}
      # The image's s6 supervisor runs Dashboard beside the gateway so both
      # processes share one container-level Hermes runtime.
      HERMES_DASHBOARD: "true"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: 9119
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Reconcile the dashboard auth provider on every start. Hermes upgrades can
    # preserve the password hash while resetting the enabled-plugin list; the
    # dashboard runs with the machine (maestro) profile, so repair both configs
    # before handing control back to the image's normal dispatcher.
    command:
      - sh
      - -lc
      - >-
        /opt/hermes/.venv/bin/hermes -p default plugins enable basic
        >/dev/null 2>&1 || true;
        /opt/hermes/.venv/bin/hermes -p maestro plugins enable basic
        >/dev/null 2>&1 || true;
        exec /opt/hermes/docker/entrypoint-dispatch.sh gateway run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  headroom-proxy:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.36.5}
    restart: unless-stopped
    ports:
      - "${HEADROOM_PROXY_BIND_HOST:-127.0.0.1}:${HEADROOM_PROXY_HOST_PORT:-8787}:8787"
    environment:
      HOME: /home/nonroot
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
      OPENAI_TARGET_API_URL: ${OPENAI_TARGET_API_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--host", "0.0.0.0", "--port", "8787", "--mode", "token"]
    volumes:
      - ${APPDATA_DIR:-./appdata}/headroom:/home/nonroot/.headroom
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  headroom-mcp:
    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom:0.36.5}
    container_name: hermes-headroom-mcp
    restart: unless-stopped
    entrypoint: ["sleep"]
    command: ["infinity"]
    environment:
      HOME: /home/nonroot
      HEADROOM_PROXY_URL: http://headroom-proxy:8787
    volumes:
      - ${APPDATA_DIR:-./appdata}/headroom:/home/nonroot/.headroom
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Private Postgres + pgvector engine for the shared GBrain. It has no route
  # onto the application network, no published port, and no credentials in the
  # Hermes container.
  gbrain-postgres:
    profiles: ["gbrain", "gbrain-viz"]
    image: ${GBRAIN_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_DB: gbrain
      POSTGRES_PASSWORD_FILE: /run/gbrain-secrets/postgres-password
    volumes:
      - type: bind
        source: ${APPDATA_DIR:-./appdata}/gbrain/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ${GBRAIN_POSTGRES_PASSWORD_FILE:-./appdata/gbrain/secrets/postgres-password.txt}
        target: /run/gbrain-secrets/postgres-password
        read_only: true
        bind:
          create_host_path: false
    networks:
      - gbrain-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Opt-in shared GBrain HTTP service. It is deliberately not part of the base
  # stack: enable it only after initializing the database and provisioning one
  # OAuth client per Hermes profile. DCR stays off; clients are owner-created.
  # The service has no published host port and never mounts the live vault.
  gbrain:
    profiles: ["gbrain"]
    build:
      context: ./gbrain
      args:
        GBRAIN_REF: ${GBRAIN_REF:-31f257a0a7b218b40e03d302bc6913c99f26f0ec}
    user: "0:0"
    depends_on:
      gbrain-postgres:
        condition: service_healthy
    environment:
      GBRAIN_HOME: /var/lib/gbrain/home
      GBRAIN_NO_ONBOARD_NUDGE: "1"
      GBRAIN_SKIP_STARTUP_HOOKS: "1"
      GBRAIN_DATABASE_PASSWORD_FILE: /run/gbrain-secrets/postgres-password
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN_FILE: /run/gbrain-secrets/admin-token
      GBRAIN_EMBEDDING_API_KEY_FILE: /run/gbrain-secrets/embedding-api-key
      GBRAIN_EMBEDDING_BASE_URL_CONFIG: ${GBRAIN_EMBEDDING_BASE_URL:-}
      GBRAIN_EMBEDDING_MODEL_CONFIG: ${GBRAIN_EMBEDDING_MODEL:-}
      GBRAIN_EMBEDDING_DIMENSIONS_CONFIG: ${GBRAIN_EMBEDDING_DIMENSIONS:-}
      GBRAIN_LITELLM_API_KEY_FILE: /run/gbrain-secrets/litellm-api-key
      GBRAIN_LITELLM_BASE_URL_CONFIG: ${GBRAIN_LITELLM_BASE_URL:-}
      GBRAIN_CHAT_MODEL_CONFIG: ${GBRAIN_CHAT_MODEL:-}
      GBRAIN_EXPANSION_MODEL_CONFIG: ${GBRAIN_EXPANSION_MODEL:-}
      GBRAIN_MODEL_DISCOVERY_CONFIG: ${GBRAIN_MODEL_DISCOVERY:-}
    command: ["serve", "--http", "--surface", "full", "--port", "3131", "--bind", "0.0.0.0"]
    # The default is loopback-only. Set GBRAIN_HTTP_BIND_HOST to the host's
    # trusted LAN address when the authenticated /admin dashboard is needed.
    ports:
      - "${GBRAIN_HTTP_BIND_HOST:-127.0.0.1}:${GBRAIN_HTTP_HOST_PORT:-3131}:3131"
    expose:
      - "3131"
    volumes:
      # The home holds GBrain configuration and source metadata. The entrypoint
      # removes the database URL that upstream init writes to config.json;
      # database and owner credentials arrive as separate read-only files.
      - type: bind
        source: ${APPDATA_DIR:-./appdata}/gbrain/shared
        target: /var/lib/gbrain/home
        bind:
          create_host_path: false
      - type: bind
        source: ${GBRAIN_POSTGRES_PASSWORD_FILE:-./appdata/gbrain/secrets/postgres-password.txt}
        target: /run/gbrain-secrets/postgres-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GBRAIN_ADMIN_TOKEN_FILE:-./appdata/gbrain/secrets/admin-token.txt}
        target: /run/gbrain-secrets/admin-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # /dev/null keeps upgrades from older .env files compatible. Guided
        # setup writes an explicit private file path before initialization.
        source: ${GBRAIN_EMBEDDING_API_KEY_FILE:-/dev/null}
        target: /run/gbrain-secrets/embedding-api-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # Optional OpenAI-compatible reasoning gateway credential. It stays
        # separate from the embedding provider so both can be self-hosted.
        source: ${GBRAIN_LITELLM_API_KEY_FILE:-/dev/null}
        target: /run/gbrain-secrets/litellm-api-key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - gbrain-db
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3131/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Hermes-facing identity broker. Each /mcp/<profile> route requires that
  # profile's inbound token and uses its distinct upstream OAuth client.
  gbrain-mcp:
    profiles: ["gbrain"]
    build:
      context: ./gbrain-allowlist-proxy
    user: "0:0"
    depends_on:
      gbrain:
        condition: service_healthy
    environment:
      PORT: "3132"
      GBRAIN_UPSTREAM_MCP_URL: http://gbrain:3131/mcp
      GBRAIN_UPSTREAM_TOKEN_URL: http://gbrain:3131/token
      GBRAIN_PROFILE_CREDENTIALS_DIR: /run/gbrain-oauth/profiles
    volumes:
      - type: bind
        source: ${GBRAIN_PROFILE_CREDENTIALS_DIR:-./appdata/gbrain/secrets/profiles}
        target: /run/gbrain-oauth/profiles
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "3132"
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Self-hosted Honcho relationship memory. Its API, deriver, PostgreSQL, and
  # Redis are part of the base stack. Postgres and Redis are separate
  # from GBrain, and the API has no published host port.
  honcho-postgres:
    image: ${HONCHO_POSTGRES_IMAGE:-pgvector/pgvector:pg15}
    environment:
      POSTGRES_USER: honcho
      POSTGRES_DB: honcho
      POSTGRES_PASSWORD: ${HONCHO_POSTGRES_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: ${APPDATA_DIR:-./appdata}/honcho/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - honcho-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  honcho-api:
    image: ${HONCHO_IMAGE:-ghcr.io/plastic-labs/honcho:v3.2.2@sha256:67f386b9860ace4be1460094556282c61365f8ea773815095e987d805762c40e}
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      honcho-postgres:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_POSTGRES_PASSWORD:-}@honcho-postgres:5432/honcho
      CACHE_URL: redis://honcho-redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${HONCHO_LLM_OPENAI_API_KEY:-}
      EMBEDDING_VECTOR_DIMENSIONS: ${HONCHO_EMBEDDING_VECTOR_DIMENSIONS:-1536}
      EMBEDDING_MODEL_CONFIG__MODEL: ${HONCHO_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: ${HONCHO_EMBEDDING_DIMENSIONS_MODE:-auto}
      DERIVER_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DERIVER_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      SUMMARY_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      SUMMARY_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DREAM_DEDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DREAM_DEDUCTION_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DREAM_INDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DREAM_INDUCTION_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      LOG_LEVEL: ${HONCHO_LOG_LEVEL:-INFO}
    networks:
      - honcho-app
      - honcho-db
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  honcho-deriver:
    image: ${HONCHO_IMAGE:-ghcr.io/plastic-labs/honcho:v3.2.2@sha256:67f386b9860ace4be1460094556282c61365f8ea773815095e987d805762c40e}
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      honcho-api:
        condition: service_healthy
      honcho-postgres:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${HONCHO_POSTGRES_PASSWORD:-}@honcho-postgres:5432/honcho
      CACHE_URL: redis://honcho-redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${HONCHO_LLM_OPENAI_API_KEY:-}
      EMBEDDING_VECTOR_DIMENSIONS: ${HONCHO_EMBEDDING_VECTOR_DIMENSIONS:-1536}
      EMBEDDING_MODEL_CONFIG__MODEL: ${HONCHO_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: ${HONCHO_EMBEDDING_DIMENSIONS_MODE:-auto}
      DERIVER_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DERIVER_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      SUMMARY_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      SUMMARY_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DREAM_DEDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DREAM_DEDUCTION_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      DREAM_INDUCTION_MODEL_CONFIG__MODEL: ${HONCHO_LLM_MODEL:-gpt-6-luna}
      DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${HONCHO_LLM_OPENAI_BASE_URL:-}
      DREAM_INDUCTION_MODEL_CONFIG__THINKING_EFFORT: ${HONCHO_LLM_THINKING_EFFORT:-none}
      LOG_LEVEL: ${HONCHO_LOG_LEVEL:-INFO}
    networks:
      - honcho-app
      - honcho-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  honcho-redis:
    image: ${HONCHO_REDIS_IMAGE:-redis:8.2}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APPDATA_DIR:-./appdata}/honcho/redis:/data
    networks:
      - honcho-app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Optional LAN-facing analytics for GBrain. Metabase stores its own users,
  # dashboards, and questions in a separate database, and reaches GBrain only
  # through a least-privilege reader provisioned by setup.sh --gbrain-metabase.
  metabase:
    profiles: ["gbrain-viz"]
    image: ${METABASE_IMAGE:-metabase/metabase:v0.58.34@sha256:abd7e4d9162e4dff67d5958d29e55b1e79de8029c51fddfdc12d9903ad126873}
    depends_on:
      gbrain-postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: gbrain-postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: gbrain_metabase_app
      MB_DB_PASS_FILE: /run/metabase-secrets/app-db-password
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY:-}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: ${TZ:-Etc/UTC}
    ports:
      - "${METABASE_BIND_HOST:-127.0.0.1}:${METABASE_HOST_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${METABASE_APP_DB_PASSWORD_FILE:-./appdata/gbrain/secrets/metabase-app-db-password.txt}
        target: /run/metabase-secrets/app-db-password
        read_only: true
        bind:
          create_host_path: false
    networks:
      - default
      - gbrain-db
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  firecrawl-api:
    image: ${FIRECRAWL_IMAGE:-ghcr.io/firecrawl/firecrawl:latest}
    restart: unless-stopped
    ports:
      - "${FIRECRAWL_BIND_HOST:-127.0.0.1}:${FIRECRAWL_HOST_PORT:-3002}:3002"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-nuq-postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      USE_DB_AUTHENTICATION: ${FIRECRAWL_USE_DB_AUTHENTICATION:-false}
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-postgres}
      POSTGRES_HOST: firecrawl-nuq-postgres
      POSTGRES_PORT: 5432
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY:-}
      SEARXNG_ENDPOINT: http://searxng:80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  firecrawl-playwright:
    image: ${FIRECRAWL_PLAYWRIGHT_IMAGE:-ghcr.io/firecrawl/playwright-service:latest}
    restart: unless-stopped
    environment:
      PORT: 3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  firecrawl-redis:
    image: ${FIRECRAWL_REDIS_IMAGE:-redis:alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APPDATA_DIR:-./appdata}/firecrawl-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  firecrawl-rabbitmq:
    image: ${FIRECRAWL_RABBITMQ_IMAGE:-rabbitmq:3-management}
    restart: unless-stopped
    volumes:
      - ${APPDATA_DIR:-./appdata}/firecrawl-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  firecrawl-nuq-postgres:
    build:
      context: ${FIRECRAWL_SOURCE_DIR:-./.firecrawl-src}/apps/nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-postgres}
    volumes:
      - ${APPDATA_DIR:-./appdata}/firecrawl-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  searxng-core:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${SEARXNG_SETTINGS_FILE:-./web-search/searxng-settings.yml}
        target: /etc/searxng/settings.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./web-search/searxng-limiter.toml
        target: /etc/searxng/limiter.toml
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  searxng:
    image: ${SEARXNG_NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_HOST:-127.0.0.1}:${SEARXNG_HOST_PORT:-8889}:80"
    volumes:
      - type: bind
        source: ./web-search/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      searxng-core:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  camofox:
    image: ${CAMOFOX_IMAGE:-ghcr.io/jo-inc/camofox-browser:latest}
    restart: unless-stopped
    ports:
      - "${CAMOFOX_BIND_HOST:-127.0.0.1}:${CAMOFOX_HOST_PORT:-9377}:9377"
    environment:
      CAMOFOX_PORT: 9377
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    name: hermes-compose-mcp-rootless
  gbrain-db:
    internal: true
  honcho-app: {}
  honcho-db:
    internal: true
