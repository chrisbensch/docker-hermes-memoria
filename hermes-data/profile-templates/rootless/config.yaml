# Profile-local Hermes config template for rootless Docker.
#
# scripts/create-profile.sh replaces __PROFILE__ with the Hermes profile name.

# Optional Hermes runtime model; this block controls Hermes Agent itself.
# model:
#   provider: lmstudio
#   default: your-local-model
#   base_url: http://host.docker.internal:1234/v1

web:
  extract_backend: firecrawl
  search_backend: firecrawl

browser:
  backend: camofox

mcp_servers:
  # Shared GBrain memory. Each profile receives a distinct broker token and
  # OAuth client; the broker endpoint remains internal to the Compose network.
  gbrain:
    url: "http://gbrain-mcp:3132/mcp/__PROFILE__"
    headers:
      Authorization: "Bearer ${GBRAIN_MCP_PROXY_TOKEN}"
    enabled: true
    connect_timeout: 10
    timeout: 120

  headroom:
    command: "sg"
    args:
      - "hostdocker"
      - "-c"
      - "exec docker exec -i -e HEADROOM_PROXY_URL=http://headroom-proxy:8787 hermes-headroom-mcp headroom mcp serve"
    enabled: true
    timeout: 120
